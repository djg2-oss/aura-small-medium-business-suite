<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuraG2P Small-to-Medium Business Suite — 10 Best Templates</title>
<style>
:root{--bg:#0b0f0e;--panel:#121a18;--accent:#c9a227;--text:#e8f0ec;--border:#2a3a34;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;}
header{padding:20px;border-bottom:1px solid var(--border);text-align:center;}
.templates{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:20px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;}
.card:hover{border-color:var(--accent);}
.preview{display:none;position:fixed;inset:0;background:#000c;z-index:100;padding:20px;overflow:auto;}
.preview.active{display:block;}
video{width:100%;max-height:300px;background:#000;}
button{background:#1a2421;color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:4px;cursor:pointer;}
button:hover{border-color:var(--accent);}
</style>
</head>
<body>
<header>
<h1>AuraG2P Small-to-Medium Business Suite</h1>
<p>One website/app · 10 best templates · Explicit video player · Shared memory ready</p>
</header>
<div class="templates" id="grid"></div>
<div class="preview" id="preview">
<button onclick="closePreview()">Close</button>
<div id="preview-content"></div>
<video controls id="vid"></video>
<input type="file" accept="video/*" onchange="document.getElementById('vid').src=URL.createObjectURL(this.files[0])">
<p>Explicit HTML5 video player (required).</p>
</div>
<script>
const templates = [
  {id:1, name:'Local Services (Plumber/Electrician)', desc:'Home, services list, booking form, testimonials, contact.'},
  {id:2, name:'Professional Consultant', desc:'About, expertise, case studies, booking, blog.'},
  {id:3, name:'Retail Shop', desc:'Products grid, about, location, contact, gallery.'},
  {id:4, name:'Restaurant/Cafe', desc:'Menu, hours, location, reservations, gallery.'},
  {id:5, name:'Fitness/Personal Trainer', desc:'Programs, schedule, testimonials, booking, about.'},
  {id:6, name:'Beauty/Salon', desc:'Services, pricing, gallery, booking, team.'},
  {id:7, name:'Real Estate Agent', desc:'Listings, about, testimonials, contact, blog.'},
  {id:8, name:'Freelancer Portfolio', desc:'Projects, skills, about, contact, resume.'},
  {id:9, name:'Small SaaS Landing', desc:'Hero, features, pricing, testimonials, CTA.'},
  {id:10, name:'Non-profit/Community', desc:'Mission, programs, donate, events, contact.'}
];
const grid = document.getElementById('grid');
templates.forEach(t => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3>${t.name}</h3><p>${t.desc}</p><button>Preview / Use Template</button>`;
  card.querySelector('button').onclick = () => showPreview(t);
  grid.appendChild(card);
});
function showPreview(t) {
  document.getElementById('preview-content').innerHTML = `<h2>${t.name}</h2><p>${t.desc}</p><p>Static HTML export ready. Integrate with Codeless Builder or G2PTechOffice shared memory.</p><button onclick="alert('Template scaffolded into shared memory (g2p-os-memory).')">Apply to Shared Memory</button>`;
  document.getElementById('preview').classList.add('active');
}
function closePreview() { document.getElementById('preview').classList.remove('active'); }
</script>
</body>
</html>
