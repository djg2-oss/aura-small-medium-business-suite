<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>G2P Small–Medium Suite</title>
<style>
body{margin:0;font-family:system-ui;background:#f6f3ee;color:#1c1915}
header{padding:18px 24px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #ddd}
h1{margin:0;font-size:22px} select,button{padding:8px 10px}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:80vh}
aside{padding:12px;border-right:1px solid #ddd} .item{padding:10px;border:1px solid #e4e0d8;margin:6px 0;cursor:pointer;background:#fff}
.item.on{border-color:#8a6a32}
main{padding:22px} .hero{padding:28px;background:#fff;border:1px solid #e4e0d8}
.player{width:100%;max-width:640px;background:#111}
</style></head><body>
<header><div><div>G2P · small to medium</div><h1 id="title">Studio shop</h1></div>
<div><select id="pick"></select></div></header>
<div class="wrap"><aside id="list"></aside><main><div class="hero" id="hero"></div>
<video class="player" controls id="vid"></video>
<p><input type="file" accept="video/*" id="vf"/> Explicit player: local file, native controls.</p>
</main></div>
<script>
const T=[
["Neighborhood studio","Book a room, sell beats, take deposits."],
["Cafe + retail","Menu, hours, catering lead form."],
["Clinic front desk","Services, providers, request appointment."],
["Trades contractor","Estimates, service area, job photos."],
["Boutique agency","Case tiles, retainers, contact."],
["Tutor / coach","Packages, calendar note, testimonials."],
["Salon / barber","Artists, book, price list."],
["Local nonprofit","Mission, donate, events."],
["Indie label shop","Releases, mailing list, store."],
["Professional service","Attorney, accountant, or advisor intake."]
];
const pick=document.getElementById("pick");
T.forEach((t,i)=>{const o=document.createElement("option");o.value=i;o.textContent=(i+1)+". "+t[0];pick.appendChild(o);});
function show(i){
  document.getElementById("title").textContent=T[i][0];
  document.getElementById("hero").innerHTML="<h2>"+T[i][0]+"</h2><p>"+T[i][1]+"</p><p>Pages: Home, Offer, Proof, Book, Contact. One app, template swap.</p>";
  document.getElementById("list").innerHTML=T.map((t,j)=>`<div class="item ${j==i?"on":""}" data-i="${j}">${t[0]}</div>`).join("");
  document.querySelectorAll(".item").forEach(el=>el.onclick=()=>show(+el.dataset.i));
}
pick.onchange=()=>show(+pick.value);
document.getElementById("vf").onchange=e=>{const f=e.target.files[0];if(f)document.getElementById("vid").src=URL.createObjectURL(f);};
show(0);
</script></body></html>
