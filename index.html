<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AuraG2P Small–Medium Business Suite</title>
<style>
body{margin:0;background:#f7f5f0;color:#1a1a1a;font-family:system-ui}
header{background:#fff;padding:16px 24px;border-bottom:1px solid #e0dcd0;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:24px}
.card{background:#fff;border:1px solid #e0dcd0;border-radius:8px;padding:16px;cursor:pointer;transition:.2s}
.card:hover{border-color:#c9a227;box-shadow:0 4px 12px #0001}
.kpi{font-size:24px;font-weight:600;color:#c9a227}
video{width:100%;background:#000;margin-top:12px}
</style></head><body>
<header><strong>AuraG2P Small–Medium Suite</strong><span>10 Best Templates</span></header>
<div class="grid" id="cards"></div>
<div style="padding:24px"><h3>Explicit Video Player</h3><video controls id="vid"></video><input type="file" accept="video/*" onchange="document.getElementById('vid').src=URL.createObjectURL(this.files[0])"></div>
<script>
const templates = [
  ["Local Service Business","Plumber, electrician, cleaner — booking + trust"],
  ["Freelancer / Consultant","Portfolio, packages, calendar"],
  ["Small Retail / Boutique","Products, inventory light, story"],
  ["Café / Restaurant","Menu, reservations, gallery"],
  ["Health & Wellness","Practitioner, packages, testimonials"],
  ["Creative Studio","Projects, process, contact"],
  ["Professional Services","Law, accounting, real estate light"],
  ["Education / Coaching","Courses, about, lead magnet"],
  ["Home Services Group","Multi-service, service areas"],
  ["Startup MVP","Landing + waitlist + simple app shell"]
];
document.getElementById('cards').innerHTML = templates.map((t,i)=>`<div class="card" onclick="alert('${t[1]}')"><div class="kpi">${i+1}</div><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('');
</script>
</body></html>
